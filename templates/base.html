<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Art Explorer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('index') }}">Art <em>Explorer</em></a>
    <nav>
      <a href="{{ url_for('random_artwork') }}">Surprise me</a>
      <a href="{{ url_for('favourites_page') }}">Favourites{% if favourites %} <span class="count">{{ favourites|length }}</span>{% endif %}</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages() %}
    {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
  {% endwith %}

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    Data and images from the <a href="https://api.artic.edu/docs/" target="_blank" rel="noopener">Art Institute of Chicago API</a>.
  </footer>
</body>
</html>
